<!-- Limit: title ≤2 lines; one hero metric; ≤4 agenda rows. Use exact source qualifiers. -->
<section class="page" id="TITLE" data-layout="title-evidence">
  <div data-role="text" class="eyebrow">{{PROJECT}} | <span class="section-text">{{SECTION}}</span></div>
  <div data-role="text" style="left:90px;top:190px;width:1020px;height:230px;font:700 112px/116px var(--font-display)">{{ASSERTION HEADLINE}}</div>
  <div data-role="text" style="left:90px;top:460px;width:940px;height:100px;font-size:32px;line-height:42px">{{SCOPE / MANAGEMENT PURPOSE}}</div>
  
  <div data-role="text" style="left:90px;top:664px;width:920px;height:200px;font-size:28px;line-height:44px">{{AGENDA · FOUR TOPICS MAXIMUM}}</div>
  <div class="card" style="left:1178px;top:190px;width:652px;height:722px">
    <div data-role="shape" class="panel"></div><div class="card-content">
      <div data-role="text" class="label" style="top:0;width:588px">{{RESULT LABEL}}</div>
      <div data-role="text" class="hero" style="top:64px;width:588px">{{VALUE}}</div>
      <div data-role="text" style="top:178px;width:588px;font-size:20px;line-height:28px">{{UNIT · PERIOD}}</div>
      
      
    </div>
  </div>
  <div data-role="shape" class="footer-rule"></div><div data-role="text" class="footer footer-source">{{SOURCE}}</div><div data-role="text" class="footer footer-mark">{{SOURCE CLASSIFICATION}}</div><div data-role="text" class="footer footer-number">{{N}}</div>
  <aside data-role="notes">{{PRESENTER SCRIPT ≤150 WORDS: POINT · CONTEXT · QUALIFIERS · SOURCE PAGES}}</aside>
</section>
